# The other half of the same claim: the hint reverts the moment the turn ends, so `kiro is working`
# is a live signal rather than something left behind in the chrome. A finished screen that still
# carried the needle would pin the pane working until the next prompt, which is the failure mode
# that made Cursor's answered trust dialog worth capturing.
[[case]]
name = "idle-after-answer"
state = "idle"
screen = '''
  12. Skip List

  A skip list is a probabilistic data structure invented by William Pugh in 1990 that
  achieves O(log n) expected time for search, insertion, and deletion without the
  complexity of tree rotations. It layers multiple linked lists on top of a base sorted
  linked list: the bottom level contains all elements; each higher level contains a
  sorted sets and LevelDB's memtable. The constant factors are larger than balanced BSTs,
  and performance depends on the quality of the random number generator, but the simplicity
  of implementation is a major practical advantage.

  13. Bloom Filter

  A bloom filter is a space-efficient probabilistic data structure that answers
  set-membership queries with the guarantee: if it says "not in the set," the element is
  definitely absent; if it says "in the set," the element is probably present (false
  positives are possible, false negatives are not). It consists of a bit array of m bits,
