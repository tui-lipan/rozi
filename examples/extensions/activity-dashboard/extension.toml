[extension]
id = "activity-dashboard"
title = "Activity dashboard"
description = "A supervised event dashboard using subscribe, publish, notify, and pick"
version = "1.0.0"
api = 1

[[commands]]
id = "open"
label = "Activity dashboard…"
exec = ["python", "{extension_dir}/bin/dashboard.py", "--pick"]

[[services]]
name = "watch"
exec = ["python", "{extension_dir}/bin/dashboard.py", "--service"]
restart = "on-failure"
