name: CI

on:
  push:
    # Feature-branch pushes are covered by `pull_request`. Running both doubled the OS matrix
    # on every PR update. Direct pushes to master still need their own run because nightly
    # publication and every release key off a successful master CI: `release.yml` refuses a tag
    # whose exact commit has not passed this run, and runs no test matrix of its own.
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustfmt and clippy are not in the toolchain this action installs by default, and the two
      # steps below are the only reason this job needs them.
      - uses: dtolnay/rust-toolchain@f50ab1ce44b2f120b2531407517fcbfb1d610fa5 # 1.96
        with:
          toolchain: "1.96"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test graphics workload file retention
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: python3 -m unittest discover -s tools -p 'test_graphics_patches.py'
      # `--features windows-launcher` so the gated Windows launcher binary is still type-checked
      # while Clippy lints every target. The release-profile step below leaves it out, which is the
      # point of the gate.
      - name: Lint
        run: cargo clippy --locked --all-targets --features windows-launcher -- -D warnings
      # This includes extension argv/path probes and service child/grandchild termination tests;
      # keep it native rather than replacing the matrix with cross-compilation.
      #
      # `--no-fail-fast` because cargo otherwise stops at the first test *binary* that fails, and
      # this matrix exists to find what only breaks on one platform. A queue of macOS and Windows
      # failures once sat behind a single failing target, revealed one per push as each fix exposed
      # the next: five rounds of CI to learn what one run could have said. Individual tests inside a
      # binary are already all reported; this extends that to the targets.
      #
      # It runs even when an earlier step failed, for the same reason. Clippy findings and a
      # platform's test results are independent facts, and a lint error on Windows once meant that
      # platform reported no test results at all - the step never started, so the run said nothing
      # about the thing the matrix is for.
      - name: Test (including native process integration)
        if: ${{ !cancelled() }}
        run: cargo test --locked --no-fail-fast
      # The published control API schema and the session wire schema are generated from the types
      # that serialize them, so they can only be trusted if regenerating them is a no-op. One
      # platform is enough: the documents do not vary by host.
      - name: Check the control API and session wire schemas are current
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: |
          cargo test --locked --features schema-gen --lib -- api_schema wire_schema
          cargo run --locked --features schema-gen --bin rozi-api-schema
          git diff --exit-code docs/schema/ schemas/session-wire.schema.json
      # Pull requests still check release-only cfg and profile behavior on every primary platform
      # without paying for optimized code generation. On master, one real optimized Linux build is
      # enough to catch release-profile failures; `release.yml` builds every shipping target before
      # publication. In particular, do not make Windows repeat its expensive MSVC ThinLTO link here.
      - name: Check release profile
        if: github.event_name == 'pull_request'
        run: cargo check --locked --release
      - name: Release build
        if: github.event_name != 'pull_request' && matrix.os == 'ubuntu-latest'
        run: cargo build --locked --release

  # The experimental Ghostty terminal engine is off by default but in every release and nightly
  # build. Linux is enough to keep it compiling and linted; the lib suite runs on the engine itself
  # (`ROZI_TEST_TERMINAL_ENGINE`), since every session server and client test builds its screens
  # through the same switch.
  ghostty-engine:
    name: ghostty engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@f50ab1ce44b2f120b2531407517fcbfb1d610fa5 # 1.96
        with:
          toolchain: "1.96"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Restore or prepare libghostty-vt
        uses: ./.github/actions/libghostty-vt
      - name: Lint
        run: cargo clippy --locked --all-targets --features ghostty-engine -- -D warnings
      - name: Test the lib suite on the Ghostty engine
        if: ${{ !cancelled() }}
        env:
          ROZI_TEST_TERMINAL_ENGINE: ghostty
        run: cargo test --locked --features ghostty-engine --lib
      - name: Check THIRD_PARTY_NOTICES.md is current
        if: ${{ !cancelled() }}
        run: python3 scripts/third_party_notices.py --check

  remote-ssh:
    name: localhost SSH transport
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ROZI_REQUIRE_SSH_TEST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@f50ab1ce44b2f120b2531407517fcbfb1d610fa5 # 1.96
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Set up key-based SSH to localhost
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo systemctl start ssh
          install -d -m 700 "$HOME/.ssh"
          ssh-keygen -t ed25519 -N '' -f "$HOME/.ssh/id_ed25519"
          cat "$HOME/.ssh/id_ed25519.pub" >> "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          ssh-keyscan -H localhost >> "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes localhost true
      - name: Test real SSH transport
        run: cargo test --locked --test remote_ssh_localhost

  # NetBSD ships no rozi binary and nothing in the matrix above runs there, but it is the one
  # target that catches a whole class of `cfg` mistake those three cannot: code written as `linux`
  # versus `not(linux)`, which silently hands every other Unix the macOS spelling. That is exactly
  # how `libc::__error` reached the netbsd-likes and broke the pkgsrc build (issue #3), and neither
  # Linux, macOS nor Windows would ever have noticed.
  #
  # A plain `cargo check --target` is not enough here: `ring` builds C, so this needs a NetBSD C
  # toolchain, and `cross` carries one in its image. Compilation only: a green tick here says the
  # code still builds for NetBSD, nothing more. Whether it runs is checked weekly by
  # `netbsd.yml` against a real NetBSD VM.
  netbsd-cross:
    name: netbsd cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@f50ab1ce44b2f120b2531407517fcbfb1d610fa5 # 1.96
        with:
          toolchain: "1.96"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cross
        run: cargo install cross --locked --version 0.2.5
      - name: Check
        run: cross check --locked --all-targets --target x86_64-unknown-netbsd
      - name: Lint
        run: cross clippy --locked --all-targets --target x86_64-unknown-netbsd -- -D warnings

  # Keep a direct Node check for the OpenCode plugin. The Cargo contracts suite also runs these
  # tests when Node is available, covering the V2 publish bridge on the primary CI platforms.
  agent-plugins:
    name: agent plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the OpenCode plugin
        run: node --test plugins/opencode/*.test.mjs

  # crates.io is the last release step and the only one that cannot be retried from the same tag,
  # so a crate it would refuse has to fail here, before anything is tagged. Release tags require a
  # successful master run of this workflow on the exact commit. 0.0.30 shipped to GitHub but not
  # crates.io after docs clips pushed the package past the upload cap.
  crate-package:
    name: crates.io package
    runs-on: ubuntu-latest
    env:
      # crates.io rejects larger uploads with 413 Payload Too Large.
      CRATES_IO_MAX_BYTES: "10485760"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@f50ab1ce44b2f120b2531407517fcbfb1d610fa5 # 1.96
        with:
          toolchain: "1.96"
      # `--no-verify`: the test matrix already builds this source; only the archive is in question.
      - name: Check the packaged crate fits the crates.io upload cap
        shell: bash
        run: |
          set -euo pipefail
          cargo package --locked --no-verify
          crate="$(ls target/package/rozi-*.crate)"
          size="$(stat -c %s "$crate")"
          echo "$crate is $size bytes (cap $CRATES_IO_MAX_BYTES)"
          test "$size" -le "$CRATES_IO_MAX_BYTES" || {
            echo "::error::$crate exceeds the crates.io upload cap; add the large files to package.exclude"
            cargo package --locked --list | xargs -d '\n' du -b 2>/dev/null | sort -rn | head -15
            exit 1
          }

  licenses:
    name: licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check licenses, sources, advisories, and bans
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses sources advisories bans
