# A finished turn. The spinner line is gone entirely rather than frozen in place, so nothing here
# survives to hold the pane working - which is the property the run clock depends on and the one
# that a status line left behind would quietly break.
[[case]]
name = "idle-after-answer"
state = "idle"
title = "π > rozi-agent-lab"
screen = '''
 19. Union-Find (disjoint-set forest).
 Maintains a partition of elements into disjoint sets with find (which set is this element
 in?) and union (merge two sets). Forest representation: each node points to a parent;
 find follows to the root. Path compression (flatten on find) and union by rank/size yield
 amortized nearly O(α(n)) per operation—inverse Ackermann, effectively constant.

 20. Skip list.
 A probabilistic layered linked list: each node appears in higher layers with probability
 p (often ½), forming express lanes. Search, insert, and delete are expected O(log n) by
 starting at the top layer and dropping down. Range iteration is natural along the base
 list. Space is expected O(n). Used in some databases as an ordered-map alternative.

╭──     Grok Composer 2.5 Fast   ~/.cache/rozi-agent-lab   10.2%/200K 󰁨  󰙺 ──────╮
╰─                                                                                       ─╯


'''

# An approval dialog, and two reasons it read idle. The dialog title `Allow tool: bash` is twelve
# non-empty lines up, outside the footer, and nothing in its chrome said `permission` or `[y/n]` -
# only the closing line `up/down navigate  enter select  esc cancel` is both in reach and specific,
# which is what the shared chooser rule now matches.
#
# The spinner is still turning while omp waits, which is the second half of the point: a pane that
# has stopped for you is not working, and blocked has to win over any working evidence on screen.
#
# The filename is redacted to the same length; it came from a real Downloads folder.
