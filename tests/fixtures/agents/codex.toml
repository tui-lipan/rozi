# Captured with scripts/capture-agents.sh, stripped of trailing whitespace, home directory
# replaced by `~`. Rules match substrings, so neither edit changes what they read.
source = "capture"
captured_at = "2026-08-20"
notes = "codex CLI, first launch in an unseen directory"

# A pane waiting for permission looks perfectly quiet, which is the worst way for detection to be
# wrong: nothing on this screen said "blocked" before the shared vocabulary learned the phrasing.
# Note what does *not* catch it - the option cursor is `›`, not Claude's `❯`, and the question is
# about trust rather than proceeding.
[[case]]
name = "startup-trust-dialog"
state = "blocked"
screen = '''
> You are in ~/.cache/rozi-agent-lab

  Do you trust the contents of this directory? Working with untrusted contents comes with higher risk of prompt injection. Trusting the directory allows project-local config, hooks, and exec policies to load.

› 1. Yes, continue
  2. No, quit

  Press enter to continue
'''

# Captured while the agent's question tool held the pane. The transcript above the chooser is cut;
# trailing whitespace stripped, home directory replaced by `~`.
[[case]]
name = "asking-a-question"
state = "blocked"
title = "[ . ] Action Required | rozi-agent-lab"
screen = '''
╰───────────────────────────────────────────────────╯
  Tip: Press Tab to queue a message when a task is running; otherwise it sends
  immediately (except !).
› testing purposes: can you use the question tool and ask me any question?
• The question tool is only available in Plan mode, so I can’t invoke it here.
  Plainly: what’s your favorite color?
› testing purposes: can you use the question tool and ask me any question?
  Question 1/1 (1 unanswered)
  Which drink do you prefer?
  › 1. Coffee (Recommended)  Choose coffee.
    2. Tea                   Choose tea.
    3. Water                 Choose water.
    4. None of the above     Optionally, add details in notes (tab).
  tab to add notes | enter to submit answer | esc to interrupt
'''
