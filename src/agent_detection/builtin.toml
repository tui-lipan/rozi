# Built-in agent definitions.
#
# This file is embedded in the binary and parsed through the same validator a user's `[[agents]]`
# entries and an extension's manifest go through. Nothing here is privileged: every rule below can
# be written in `config.toml`, and any entry can be replaced by declaring its `id` there.
#
# Rules match text that has already been lowercased, so needles are written lowercase and regexes
# never need a case-insensitive flag. See docs/agents.md.

# The shared vocabulary, applied to every agent that does not set `base = false`. It is what makes
# an agent with no rules of its own - most of them - already worth detecting.
[[base]]
state = "blocked"
screen = { any_of = [
    "permission required",
    "action required",
    "do you want to proceed?",
    "waiting for permission",
    "allow command?",
    "[y/n]",
    "yes (y)",
] }

[[base]]
state = "blocked"
title = { any_of = ["action required"] }

# Asking to trust a directory is asking. Both of these read as idle before they were captured - a
# pane waiting for permission looks perfectly quiet, which is the worst way for this to be wrong.
#
# Scoped to the footer, and that scope is doing real work rather than being a precaution: Cursor
# leaves its answered trust dialog on screen for the rest of the session, so an unscoped needle
# marks a Cursor pane blocked forever. The question sits within the last few non-empty lines while
# it is live, and scrolls above them once the agent moves on.
[[base]]
state = "blocked"
scope = "footer"
screen = { any_of = [
    "do you trust the contents of this directory",
    "do you trust the files in this folder",
] }

# An agent asking a *question* rather than for permission. Same thing for a pane - it is waiting
# for a person and will wait forever - but the screen looks nothing like an approval prompt, and
# these six agents were read as idle or working while a chooser sat open in front of them.
#
# The most portable tell turned out to be the escape hatch every chooser offers: somewhere under
# the options, a way to answer in your own words. Antigravity writes `Write-in...`, Maki `Type your
# own answer`, Cursor `Other: (type to answer)`, Cline `Type a response...`. It appears while the
# chooser is open and goes away with it.
[[base]]
state = "blocked"
scope = "footer"
screen = { any_of = [
    "type your own answer",
    "type a response",
    "type to answer",
    "write-in",
] }

# A numbered question header, for the ones that count their questions instead: Codex's
# `Question 1/1 (1 unanswered)`, Antigravity's `Question 1/1:`. Anchored to the start of a line so
# prose about a question cannot claim it, and allowing a few frame characters in front because
# Cursor and Copilot draw theirs inside a box.
[[base]]
state = "blocked"
scope = "footer"
screen = { regex = true, any_of = ["(?m)^\\s*\\W{0,3}\\s*question \\d+\\s*(/|of)\\s*\\d+"] }

# Said outright. Pi keeps its spinner running and its `Working...` line on screen while it waits,
# so without this a pane that has stopped for you reads as one that is busy.
[[base]]
state = "blocked"
scope = "footer"
screen = { any_of = ["waiting for user input"] }

# The chooser chrome OpenCode has always been read by, now shared: Maki's question box closes with
# `Enter submit Tab next Esc dismiss`. A submit hint alone is not enough - a transcript quoting one
# footer token is not a live dialog - which is what the `all_of` is for.
[[base]]
state = "blocked"
scope = "footer"
screen = { all_of = ["esc dismiss"], any_of = ["enter submit", "enter toggle", "enter confirm"] }

# The same chooser idiom in the other common wording. omp closes its `Allow tool: bash` dialog with
# `up/down navigate  enter select  esc cancel`, and the dialog title itself sits twelve lines up -
# outside the footer - so the closing line is the only part of it a scoped rule can reach.
[[base]]
state = "blocked"
scope = "footer"
screen = { all_of = ["esc cancel"], any_of = ["enter select"] }

# Asking permission to run something, said outright. Kiro writes `shell requires approval` above
# its choices, six lines up, and read idle for as long as it sat there - which is the reading that
# matters: an agent stopped for permission is stopped, and a run clock that keeps counting is
# measuring the wrong thing.
[[base]]
state = "blocked"
scope = "footer"
screen = { any_of = ["requires approval"] }

# A braille spinner at the front of the terminal title. Agents animate one there while a turn is in
# flight and drop it the moment they stop, which makes it the only working signal some of them give
# a pane at all: Grok's footer says `Esc:cancel` whether it is working or not, while its title
# cycles `⠧ - Waiting for response…`, `⠼ - Thinking`, `⠙ - Responding`. Anchored at the start so a
# spinner quoted inside a transcript-derived title cannot claim it.
[[base]]
state = "working"
title = { regex = true, any_of = ["^[\\x{2800}-\\x{28ff}]"] }

# The same spinner, animating at the head of a line in the live chrome rather than in the title:
# Maki's `⠋ [BUILD]` status line, Pi's `⠦ Working...`, Grok's `⠸ Waiting for response… 0.5s`. Every
# captured screen carrying one is a pane mid-turn, and no idle screen in the corpus has one - an
# agent that stops animating when it stops working is the whole convention this reads.
#
# Footer-scoped because a transcript quotes spinner frames constantly: an agent describing its own
# output, or a log pasted into the conversation, puts braille anywhere on screen but not in the
# chrome under it.
[[base]]
state = "working"
scope = "footer"
screen = { regex = true, any_of = ["(?m)^\\s*[\\x{2800}-\\x{28ff}]"] }

# An interrupt hint in the live chrome means a run is in flight. Scoped to the footer because an
# agent's transcript quotes these constantly while writing *about* interrupting.
[[base]]
state = "working"
scope = "footer"
screen = { any_of = [
    "esc to interrupt",
    "esc again to interrupt",
    "press esc to interrupt",
    "ctrl+c to interrupt",
    "esc interrupt",
] }

# Claude Code opts out of the shared blocked vocabulary: its transcripts quote approval prose
# verbatim while a run is still in flight, so only the dialog's own structure counts. The footer
# rule below is the shared working rule, restated because `base = false` drops it too.
[[agents]]
id = "claude"
label = "Claude Code"
base = false
match = { names = ["claude", "claude-code"], paths = ["@anthropic-ai/claude-code"] }

# The selection cursor on a numbered option: the stable structure of every approval dialog, and
# the one thing a transcript discussing approvals does not reproduce.
[[agents.states]]
state = "blocked"
screen = { regex = true, any_of = ["(?m)^\\s*❯\\s*\\d+\\. "] }

[[agents.states]]
state = "working"
title = { regex = true, any_of = ["^[\\x{2800}-\\x{28ff}]"] }

[[agents.states]]
state = "working"
scope = "footer"
screen = { any_of = [
    "esc to interrupt",
    "esc again to interrupt",
    "press esc to interrupt",
    "ctrl+c to interrupt",
    "esc interrupt",
] }

[[agents]]
id = "opencode"
label = "OpenCode"
match = { names = ["opencode", "open-code", "opencode-tui"], paths = ["opencode-ai", "/opencode/"] }

[[agents.states]]
state = "blocked"
screen = { all_of = ["esc dismiss"], any_of = ["enter submit", "enter toggle", "enter confirm"] }

# The run progress bar. A generic submit hint is not enough on its own - a transcript quoting one
# footer token is not a live dialog - which is what the `all_of` above is for.
[[agents.states]]
state = "working"
screen = { regex = true, any_of = ["[■⬝]{4,}"] }

# The child-session navigator replaces the composer and the status line, the only places the parent
# run exposes its state. Nothing on this screen speaks for that run, so it is not idle.
[[agents.states]]
state = "unknown"
screen = { all_of = ["parent up"], any_of = ["prev left", "next right"] }

# The startup splash, for the same reason and with more at stake. Before the server answers,
# OpenCode draws its wordmark over an empty screen with one status line under it - and that line is
# `⠋ Waiting for opencode server...`, a braille spinner at the head of a line, which is character
# for character the shape the shared working rule reads on Pi's `⠦ Working...`. Centering is the
# only difference and it is not one a needle can see, so a pane that had not started yet read as a
# run in flight, and every launch ended with a completion notification for work nobody asked for.
#
# `unknown` rather than `idle` because the pane may be reloading rather than booting: the same view
# comes back for `Reloading startup data...`, and holding whatever the pane was doing is right in
# both cases. Footer-scoped, because these are ordinary English sentences an agent could write.
[[agents.states]]
state = "unknown"
scope = "footer"
screen = { any_of = [
    "starting opencode server",
    "waiting for opencode server",
    "server is still starting",
    "loading startup data",
    "reloading startup data",
] }

[[agents]]
id = "codex"
label = "Codex"
match = { names = ["codex", "codex-cli"], paths = ["@openai/codex"] }

[[agents]]
id = "pi"
label = "Pi"
match = { names = ["pi", "pi-coding-agent"], paths = ["pi-coding-agent"] }

# Pi draws `⠦ Working...` at the end of the transcript and nothing the shared vocabulary
# recognizes: its footer holds no interrupt hint, its title holds no spinner, and the `escape
# interrupt` in its startup banner is permanent chrome that says nothing about the current turn.
# Unscoped because the line follows the transcript rather than sitting in footer chrome.
[[agents.states]]
state = "working"
screen = { any_of = ["working..."] }

[[agents]]
id = "gemini"
label = "Gemini CLI"
match = { names = ["gemini", "gemini-cli"], paths = ["@google/gemini-cli"] }

[[agents]]
id = "github-copilot"
label = "GitHub Copilot"
match = { names = ["copilot", "github-copilot", "ghcs"], paths = ["@github/copilot"] }

[[agents]]
id = "cursor"
label = "Cursor Agent"
# Neither name finds it in practice. The CLI runs as `~/.local/bin/agent` with the process name
# `MainThread`, so a pane running Cursor was not recognized as an agent at all - the version path
# in its argv is the only thing that names it.
match = { names = ["cursor", "cursor-agent"], paths = ["cursor-agent"] }

[[agents]]
id = "devin"
label = "Devin CLI"
match = { names = ["devin", "devin-cli"] }

[[agents]]
id = "antigravity"
label = "Antigravity"
match = { names = ["agy", "antigravity", "antigravity-cli"] }

[[agents]]
id = "cline"
label = "Cline"
match = { names = ["cline"] }

# The same braille spinner the shared vocabulary reads, without the footer scope, because Cline is
# the one agent whose live spinner is not in its chrome: it rides the head of the line being
# written and drifts up the screen as text streams under it. Measured at 48 to 51 lines above the
# bottom during one answer, while Cline's own chrome - a queued-message box, the input box, the
# model line - filled all eight footer rows. Read through the shared rule, a minute of streaming is
# a minute of idle.
#
# What makes dropping the scope safe here is that the spinner is not decoration on a finished line:
# once a step completes Cline replaces the braille with `*`, so a screen holding a whole answer
# carries no braille at all. The needle is anchored to the start of a line, which prose does not do.
[[agents.states]]
state = "working"
screen = { regex = true, any_of = ["(?m)^\\s*[\\x{2800}-\\x{28ff}]"] }

[[agents]]
id = "omp"
label = "OMP"
match = { names = ["omp"] }

[[agents]]
id = "mastracode"
label = "Mastra Code"
match = { names = ["mastracode", "mastra-code"] }

[[agents]]
id = "kimi"
label = "Kimi Code"
match = { names = ["kimi", "kimi-code"] }

# Kimi numbers its choices instead of naming a verb, so the words a shared approval rule looks for
# are in the options rather than the chrome - and `Approve for this session` lands exactly eight
# non-empty lines from the bottom, which is the last row the footer window reaches. Reading it
# there would pass today and break on the next line Kimi adds above the prompt, so this keys off
# the closing line of the chooser instead, which stays four from the bottom whatever it contains.
[[agents.states]]
state = "blocked"
scope = "footer"
screen = { all_of = ["↵ confirm"], any_of = ["1/2/3/4 choose"] }

[[agents]]
id = "kiro"
label = "Kiro CLI"
match = { names = ["kiro", "kiro-cli"] }

# Kiro spells its state out instead of animating it: the prompt hint under the transcript reads
# `Kiro is working · Type to steer · Ctrl+S to queue` for the whole turn and reverts to `ask a
# question or describe a task` afterwards. There is no spinner and no interrupt hint, so nothing in
# the shared vocabulary sees the turn at all - a minute of streaming read idle until this rule.
#
# The braille on a Kiro screen is its startup logo, not a spinner. It sits well above the footer at
# rest and drifts further up as the transcript grows, which is the only reason the shared braille
# rule stays quiet here; `kiro-splash-is-not-a-spinner` in the corpus is what holds that.
[[agents.states]]
state = "working"
scope = "footer"
screen = { any_of = ["kiro is working"] }

[[agents]]
id = "droid"
label = "Droid"
match = { names = ["droid"] }

[[agents]]
id = "amp"
label = "Amp"
match = { names = ["amp", "amp-local"] }

[[agents]]
id = "grok"
label = "Grok"
match = { names = ["grok", "grok-build"] }

[[agents]]
id = "hermes"
label = "Hermes"
match = { names = ["hermes", "hermes-agent"] }

[[agents]]
id = "kilo"
label = "Kilo Code"
match = { names = ["kilo", "kilo-code"] }

[[agents]]
id = "qoder-cli"
label = "Qoder CLI"
match = { names = ["qoder", "qodercn", "qodercli", "qoderclicn"] }

[[agents]]
id = "maki"
label = "Maki"
match = { names = ["maki"] }

[[agents]]
id = "aider"
label = "Aider"
match = { names = ["aider", "aider-chat"] }

[[agents]]
id = "goose"
label = "Goose"
match = { names = ["goose", "goose-cli"] }

# Goose gives a turn in flight nothing to read: no spinner past the first moment, no interrupt
# hint, and a title that never changes. What changes is its chrome - the context meter that sits
# above the prompt is redrawn whenever Goose is at rest and absent while it works - so this rule is
# built around an absence, which is the shape the format deliberately refuses on its own.
#
# The positive half is the tool-call marker Goose puts in front of every step. It is weak by itself
# (it stays in the transcript afterwards, so an idle pane's footer has one too) and is here to keep
# the veto from claiming a half-drawn startup screen rather than to identify work.
#
# The veto is the meter, matched without depending on its bar glyph, which changes as context
# fills. It is also what keeps a *typed* prompt from reading as work: typing replaces
# `Enter to send · Ctrl+J newline` with the text, so the input line is no evidence of anything.
[[agents.states]]
state = "working"
scope = "footer"
screen = { regex = true, any_of = ["▸ "], none_of = ["(?m)^\\s*\\S+\\s+\\d+%\\s+\\S+/\\S+$"] }
