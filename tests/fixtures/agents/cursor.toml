# Captured with scripts/capture-agents.sh, stripped of trailing whitespace, home directory
# replaced by `~`, box rules narrowed to fit. Rules match substrings, so none of that changes what
# they read.
source = "capture"
captured_at = "2026-08-20"
notes = "cursor-agent v2026.08.11, after the workspace-trust prompt was answered"

# This screen is why the shared trust rules are footer-scoped. Cursor answers its trust prompt and
# then keeps the whole dialog on screen for the rest of the session - the question, the options,
# and a `⏳ Trusting workspace...` line under them. An unscoped needle for "do you trust the
# contents of this directory" marks this pane blocked forever, on a session where nothing is
# waiting for anybody. Scoped to the last few non-empty lines, the answered dialog scrolls out of
# range and the pane reads as what it is.
[[case]]
name = "idle-after-answering-trust"
state = "idle"
title = "Cursor Agent"
screen = '''
Tip: You can start the Cursor CLI with `agent` (same as `cursor-agent`).

  ╭──────────────────────────────────────────────────────────────────────╮
  │                                                                      │
  │  ⚠ Workspace Trust Required                                          │
  │                                                                      │
  │  Cursor Agent can execute code and access files in this directory.   │
  │                                                                      │
  │  Do you trust the contents of this directory?                        │
  │                                                                      │
  │    ~/.cache/rozi-agent-lab                                           │
  │                                                                      │
  │    [a] Trust this workspace                                          │
  │    [q] Quit                                                          │
  │                                                                      │
  │  ⏳ Trusting workspace...                                            │
  │                                                                      │
  ╰──────────────────────────────────────────────────────────────────────╯

  Cursor Agent
  v2026.08.11-e8db854
  Tip: Use /plan to iterate on an implementation plan before code changes.

  → Plan, search, build anything

  GPT-5.6 Sol 272K Extra High                            Run Everything
  ~/.cache/rozi-agent-lab
'''

# No working or blocked case yet, and the live trust dialog is not covered either: Cursor keys its
# options by letter (`[a]`, `[q]`) rather than by number, and the only thing separating the live
# dialog from the answered one above is the `▶` cursor on the selected option. That is a rule this
# corpus has one screen for, which is not enough to write it from.
