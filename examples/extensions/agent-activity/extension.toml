[extension]
id = "agent-activity"
title = "Agent activity"
description = "Notifies on pane-reported status changes and lists them in a picker"
version = "1.0.0"
api = 1

[[commands]]
id = "open"
label = "Agent activity…"
exec = ["python", "{extension_dir}/bin/agent_activity.py", "--pick"]

[[services]]
name = "watch"
exec = ["python", "{extension_dir}/bin/agent_activity.py", "--service"]
restart = "on-failure"
