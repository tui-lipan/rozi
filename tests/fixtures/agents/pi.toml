# Captured from pi 0.84.2 with scripts/capture-agents.sh, then trimmed: the startup banner's skill
# and theme lists are the operator's own installed set and carry nothing about state, and the
# working directory in the title is a scratch path.
source = "capture"
captured_at = "2026-08-20"
notes = "pi 0.84.2, grok-4.5 backend, 101-column pane"

[[case]]
name = "idle-startup"
state = "idle"
title = "π - sample-project"
screen = '''
 pi v0.84.2
 escape interrupt · ctrl+c/ctrl+d clear/exit · / commands · ! bash · ctrl+o more
 Press ctrl+o to show full startup help and loaded resources.

 Pi can explain its own features and look up its docs. Ask it how to use or extend Pi.

─────────────────────────────────────────────────────────────────────────────────────────────

─────────────────────────────────────────────────────────────────────────────────────────────
/tmp/sample-project
$0.000 (sub) 0.0%/500k (auto)                                               grok-4.5 • medium
'''

# The one line that says a turn is in flight. Pi draws no interrupt hint in its footer while it
# works - the header's `escape interrupt` is startup chrome and sits there permanently - so the
# shared vocabulary sees nothing here and this literal is the whole signal.
[[case]]
name = "working"
state = "working"
title = "π - sample-project"
screen = '''
 pi v0.84.2
 escape interrupt · ctrl+c/ctrl+d clear/exit · / commands · ! bash · ctrl+o more

 Read README.md in this directory and describe it in one sentence.

 ⠦ Working...
─────────────────────────────────────────────────────────────────────────────────────────────

─────────────────────────────────────────────────────────────────────────────────────────────
/tmp/sample-project
$0.000 (sub) 0.0%/500k (auto)                                               grok-4.5 • medium
'''

# The same pane once the turn is done: the spinner line is gone and nothing replaces it.
[[case]]
name = "idle-after-turn"
state = "idle"
title = "π - sample-project"
screen = '''
 pi v0.84.2
 escape interrupt · ctrl+c/ctrl+d clear/exit · / commands · ! bash · ctrl+o more

 Read README.md in this directory and describe it in one sentence.

 The user wants me to read the README.md file in the current directory and describe it in one
 sentence.

 I'll read the README.md in the working directory.

 read /tmp/sample-project/README.md

 I have the README content. I'll describe it in one sentence.

 This README describes a minimal sample project meant to give an agent a short, harmless file to
 read.

─────────────────────────────────────────────────────────────────────────────────────────────

─────────────────────────────────────────────────────────────────────────────────────────────
/tmp/sample-project
↑5.3k ↓90 R768 CH12.4% $0.011 (sub) 0.6%/500k (auto)                        grok-4.5 • medium
'''

# No *approval* prompt captured: Pi deleted a file when asked, without stopping to confirm, so
# whether it gates that class of action at all is still open.
#
# It does stop for a question, and this is what that looks like - note that the spinner keeps
# turning and `Working...` stays on screen the whole time it waits, so every working rule Pi has
# still matches here. `Waiting for user input...` is what has to outrank them, and blocked
# outranking working is what makes that work.
[[case]]
name = "asking-a-question"
state = "blocked"
title = "π - rozi-agent-lab"
screen = '''
 Th│   3. That was enough, thanks                                          │
   │     Type something. — Enter a custom response                         │
 Su│  type filter • PgUp/PgDn prompt • backspace erase • ↑↓ navigate •     │
   │  alt+o hide • enter select • esc clear/cancel • ctrl+c cancel         │
   ╰───────────────────────────────────────────────────────────── v0.14.0 ─╯
 ask_user What would you like to test next?
   3 option(s): Something coding-related, Something else entirely, That was
 enough, thanks
 Waiting for user input...
 ⠼ Working...
────────────────────────────────────────────────────────────────────────────────
────────────────────────────────────────────────────────────────────────────────
~/.cache/rozi-agent-lab
↑3.5k ↓91 R384 CH10.0% $0.008 (sub) 0.8%/500k (auto)           grok-4.5 • medium
'''
