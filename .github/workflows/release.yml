name: Release

on:
  push:
    tags:
      - "v*"
  # Buildable on demand so the artifact pipeline can be exercised without minting a tag. A manual
  # run uploads workflow artifacts but never publishes a release.
  workflow_dispatch:

permissions:
  contents: write

env:
  TUI_LIPAN_REF: 524611f8e07e5b0f88ac5b4bb0cf0dee9ba0f0b8

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    # Hoisted to the job so the signing steps can gate on them: a step's `if:` may read `env` but
    # not `secrets`, so "sign only when a certificate is configured" has to go through here.
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: hyprmux
      - uses: actions/checkout@v4
        with:
          repository: tui-lipan/tui-lipan
          ref: ${{ env.TUI_LIPAN_REF }}
          path: tui-lipan
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: ${{ matrix.target }}

      - name: Build
        working-directory: hyprmux
        run: cargo build --locked --release --target ${{ matrix.target }}

      # Every artifact is unpacked and run before it can be published. A binary that cannot even
      # print its own version is not one anybody should be downloading, and this is the cheapest
      # possible place to notice - each runner is the platform it just built for, so this is a real
      # native execution, not a cross-compiled guess.
      - name: Smoke-test the built binary
        working-directory: hyprmux
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/hyprmux"
          [ "${{ matrix.archive }}" = "zip" ] && binary="$binary.exe"
          "$binary" --version
          "$binary" --help > /dev/null

      # Signing is opt-in on credentials being present, so a fork (or this repo before anybody sets
      # the secrets up) still produces working unsigned artifacts rather than failing the release.
      # An unsigned macOS binary is Gatekeeper-quarantined on download but runs fine from a
      # terminal, which is where a terminal multiplexer is run from anyway.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        working-directory: hyprmux
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: |
          set -euo pipefail
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          codesign --force --options runtime --timestamp \
            --sign "$MACOS_SIGN_IDENTITY" \
            "target/${{ matrix.target }}/release/hyprmux"
          rm -f certificate.p12

      - name: Sign (Windows)
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        working-directory: hyprmux
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          [IO.File]::WriteAllBytes('certificate.pfx', [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          & signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            /f certificate.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            "target/${{ matrix.target }}/release/hyprmux.exe"
          Remove-Item certificate.pfx

      - name: Package
        id: package
        working-directory: hyprmux
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="hyprmux-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/hyprmux.exe" "dist/${name}/"
          else
            cp "target/${{ matrix.target }}/release/hyprmux" "dist/${name}/"
          fi
          cp README.md LICENSE-APACHE LICENSE-MIT "dist/${name}/"
          cp -r examples "dist/${name}/examples"

          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "${name}.zip" "${name}" > /dev/null
            archive="${name}.zip"
          else
            tar -czf "${name}.tar.gz" "${name}"
            archive="${name}.tar.gz"
          fi

          # Checksums are produced next to the archive on the machine that built it, so the digest
          # covers exactly the bytes that were uploaded.
          if command -v sha256sum > /dev/null; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      # Re-extract the packaged archive and run *that* binary, not the one in `target/`. This is the
      # check that catches a packaging bug (wrong file copied, archive built from the wrong
      # directory, an executable bit lost in the tarball) rather than a build bug.
      - name: Smoke-test the extracted archive
        working-directory: hyprmux/dist
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="hyprmux-${version}-${{ matrix.target }}"
          rm -rf verify && mkdir verify && cd verify
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z x "../${{ steps.package.outputs.archive }}" > /dev/null
            "./${name}/hyprmux.exe" --version
          else
            tar -xzf "../${{ steps.package.outputs.archive }}"
            "./${name}/hyprmux" --version
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            hyprmux/dist/*.tar.gz
            hyprmux/dist/*.zip
            hyprmux/dist/*.sha256
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
