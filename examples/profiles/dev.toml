# Example reusable launch profile for hyprmux.
# Copy to ~/.config/rozi/profiles/dev.toml, then:
#   hyprmux dev                         # canonical session "dev"
#   hyprmux new review --profile dev    # independent session "review"
#
# Each pane starts your interactive shell in its cwd and types its command at the first
# prompt, so quitting lazygit or nvim returns that pane to the shell.

version = 1
active_workspace = 0

[[workspaces]]
index = 0
layout = "dwindle"
focused_pane = 1

[[workspaces.panes]]
id = 0
name = "lazygit"
command = "lazygit"
keep_open = true

[[workspaces.panes]]
id = 1
name = "nvim"
command = "nvim"
