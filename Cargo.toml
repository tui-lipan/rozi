[package]
name = "hyprmux"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Hyprland-style tiling terminal multiplexer built on tui-lipan"

[dependencies]
tui-lipan = { path = "../tui-lipan", features = ["terminal", "theme-reload"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
