version = 1
active_workspace = 0

[[workspaces]]
index = 0
name = "code"
layout = "columns"
focused_pane = 0

[[workspaces.panes]]
id = 0
name = "editor"
cwd = "~/src/rozi"
argv = ["nvim", "src/layout/mod.rs"]

[[workspaces.panes]]
id = 1
name = "shell"
cwd = "~/src/rozi"
command = "git --no-pager log --oneline --color -24 --format='%C(yellow)%h%C(reset) %s'"

[[workspaces]]
index = 1
name = "docs"

[[workspaces.panes]]
id = 10
name = "shell"
cwd = "~/src/rozi"
