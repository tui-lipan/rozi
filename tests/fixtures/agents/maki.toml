# Captured with scripts/capture-agents.sh, stripped of trailing whitespace, home directory
# replaced by `~`. Rules match substrings, so neither edit changes what they read.
source = "capture"
captured_at = "2026-08-20"
notes = "maki with google/gemini-3.5-flash-lite, 120-column pane"

# The two screens differ in one character: the spinner at the head of the status line. Maki's title
# is empty, its footer carries no interrupt hint, and its prompt box is drawn either way - the
# animation is the entire difference between a turn in flight and a finished one.
[[case]]
name = "working"
state = "working"
screen = '''
you> Read README.md in this directory and describe it in one sentence.

──────────────────────────────────────────────────────────────────────────────────
❯ Queue another prompt...
──────────────────────────────────────────────────────────────────────────────────
 ⠋ [BUILD]                       ~/.cache/rozi-agent-lab  google/gemini-3.5-flash-lite  0/1.0m (0%)
'''

[[case]]
name = "idle-after-turn"
state = "idle"
screen = '''
● list> ~/.cache/rozi-agent-lab (0 entries)                         6.0k↑ 27↓  20:53:52

maki> The

──────────────────────────────────────────────────────────────────────────────────
❯ Ask maki to create a helm chart...
──────────────────────────────────────────────────────────────────────────────────
 [BUILD]                         ~/.cache/rozi-agent-lab  google/gemini-3.5-flash-lite  6.1k/1.0m (0%)
'''

# Captured while the agent's question tool held the pane. The transcript above the chooser is cut;
# trailing whitespace stripped, home directory replaced by `~`.
[[case]]
name = "asking-a-question"
state = "blocked"
title = "user@host:~/.cache/rozi-agent-lab"
screen = '''
⠏ question> 1 question                                              21:30:52
╭ Question ──────────────────────────────────────────────────────────────────╮
│ This is a test question for testing purposes. Which option do you prefer?  │
│  (single answer)                                                           │
│                                                                            │
│▸ ○ Option A — Option A description                                         │
│─────────────────────────────────────────────────────────────────────────── │
│  ○ Option B — Option B description                                         │
│─────────────────────────────────────────────────────────────────────────── │
│  ○ Type your own answer                                                    │
│                                                                            │
│                                                                            │
╰───────────────────────────────────────── Enter submit Tab next Esc dismiss ╯
 ⠏ [BUILD]  ~/.cache/rozi-agent-lab  ../gemini-3.5-flash-lite  6.0k/1.0m (0%)
'''

# Open question, and the reason there is no long-answer working case here.
#
# Every other agent was rechecked mid-way through a minute-long streamed answer, because a short run
# can leave a spinner inside the footer window by luck. Maki's status line during that pass read
# ` [BUILD] …` with no spinner in front of it, and the screen captured while detection reported
# `working` was byte-identical to one taken fifteen seconds later that reported `idle`. Two
# explanations fit and those two screens cannot separate them:
#
#   - Maki had genuinely finished, and the finish was noticed late, or
#   - Maki drops the spinner while streaming prose and animates it only during tool calls, which is
#     Cline's problem in a different shape.
#
# Settling it needs a Maki run watched from the moment it starts, sampling the screen and the
# reported state together. See the `agent-screens` skill.
