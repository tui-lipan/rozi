[package]
name = "rozi"
version = "0.0.15"
edition = "2024"
# Set by the dependency tree, not by this crate's own source: terminal-images reaches
# ratatui-image -> icy_sixel -> quantette, which requires 1.90.
rust-version = "1.90"
license = "MPL-2.0"
description = "Modern tiling terminal multiplexer built on tui-lipan"
repository = "https://github.com/tui-lipan/rozi"
homepage = "https://rozi.tui-lipan.dev"
# The crate is mostly a binary, so docs.rs has little to show; point readers at
# the handwritten documentation instead.
documentation = "https://rozi.tui-lipan.dev"
readme = "README.md"
authors = ["Adam Mikołajczyk <adam@tui-lipan.dev>"]
keywords = ["terminal", "multiplexer", "tui", "tiling", "pty"]
categories = ["command-line-utilities", "development-tools"]
# `docs/` doubles as the VitePress source for the website. The pages themselves
# are worth shipping; its build system is not.
exclude = [
  # 7 MB of README decoration; crates.io renders it from the repository.
  "/assets/demo.gif",
  "/docs/.vitepress/",
  "/docs/package.json",
  "/docs/package-lock.json",
  "/docs/wrangler.jsonc",
]

[dependencies]
# 0.5.0 adds per-row description spinners while retaining termina ^0.4, whose mouse decoder no
# longer panics the input worker on a report at column or row 0.
tui-lipan = { version = "0.5.0", features = [
  "terminal",
  "terminal-images",
  "terminal-serde",
  "clipboard-images",
  "theme-reload",
  "devtools",
] }
# Registry rather than a path dep so Cargo.lock pins the exact engine a signed release was built
# against. A 0.0.x requirement resolves to that version alone, so an upgrade is always deliberate.
relswap = "0.0.10"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = { version = "1.1.3", default-features = false, features = ["parse", "serde", "std", "display"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
notify = "8"
regex-lite = "0.1"
semver = { version = "1", features = ["serde"] }
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
getrandom = "0.4.3"
url = "2.5.8"

[features]
# Headless PNG/JSON capture for visual review. Opt-in so release builds do not
# carry the font and image-encoding dependencies. Rozi captures run the built binary; see the
# `tui-lipan-visual` skill.
# JSON export is omitted: it pulls a serde_json newer than this crate's pinned
# lock. Add "tui-lipan/ui-snapshot-json" plus `cargo update -p serde_json` for it.
ui-snapshot = ["tui-lipan/ui-snapshot-png"]

# The Windows activation launcher. Gated because a plain `cargo build --release` would otherwise
# link it on every platform, and it means nothing outside Windows: relswap activates a managed
# install through a symlink everywhere else. Cargo has no way to attach a target to a `[[bin]]`, so
# the callers that need it ask for it - `.github/workflows/release.yml` when packaging the zip, and
# CI's check and lint steps, which keep type-checking it on all three hosts.
windows-launcher = []

[[bin]]
name = "rozi-launcher"
path = "src/bin/rozi-launcher.rs"
required-features = ["windows-launcher"]
test = false

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"

[[bench]]
name = "terminal_ingest"
harness = false

[[bench]]
name = "snapshot_rebuild"
harness = false

[[bench]]
name = "protocol_framing"
harness = false

[[bench]]
name = "session_pipeline"
harness = false

[[bench]]
name = "app_render"
harness = false

[[bench]]
name = "scrollback_search"
harness = false

[[bench]]
name = "server_fairness"
harness = false

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
# Unwinding tables cost ~2MB of binary with nothing to catch them: the only
# catch_unwind is tui-lipan's input worker, and terminal restore runs from the
# panic hook, which still fires under abort.
panic = "abort"

[profile.release-debug]
inherits = "release"
debug = true
strip = false

[profile.test]
# Full DWARF made each integration-test executable hundreds of megabytes and turned linking into
# an I/O bottleneck. Test names remain symbolized without source-level debugger information.
debug = 0

[profile.dev-fast]
inherits = "dev"
opt-level = 2
debug = 0
debug-assertions = false
overflow-checks = false
incremental = true
codegen-units = 16

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.curve25519-dalek]
opt-level = 3
