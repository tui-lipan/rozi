# Captured with scripts/capture-agents.sh, stripped of trailing whitespace, home directory
# replaced by `~`. Rules match substrings, so neither edit changes what they read.
source = "capture"
captured_at = "2026-08-20"
notes = "maki with google/gemini-3.5-flash-lite, 120-column pane"

# The two screens differ in one character: the spinner at the head of the status line. Maki's title
# is empty, its footer carries no interrupt hint, and its prompt box is drawn either way - the
# animation is the entire difference between a turn in flight and a finished one.
[[case]]
name = "working"
state = "working"
screen = '''
you> Read README.md in this directory and describe it in one sentence.

──────────────────────────────────────────────────────────────────────────────────
❯ Queue another prompt...
──────────────────────────────────────────────────────────────────────────────────
 ⠋ [BUILD]                       ~/.cache/rozi-agent-lab  google/gemini-3.5-flash-lite  0/1.0m (0%)
'''

[[case]]
name = "idle-after-turn"
state = "idle"
screen = '''
● list> ~/.cache/rozi-agent-lab (0 entries)                         6.0k↑ 27↓  20:53:52

maki> The

──────────────────────────────────────────────────────────────────────────────────
❯ Ask maki to create a helm chart...
──────────────────────────────────────────────────────────────────────────────────
 [BUILD]                         ~/.cache/rozi-agent-lab  google/gemini-3.5-flash-lite  6.1k/1.0m (0%)
'''
