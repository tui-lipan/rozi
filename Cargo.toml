[package]
name = "hyprmux"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Hyprland-style tiling terminal multiplexer built on tui-lipan"

[dependencies]
tui-lipan = { path = "../tui-lipan/", features = [
  "terminal",
  "terminal-images",
  "terminal-serde",
  "clipboard-images",
  "theme-reload",
  "devtools",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.1.3", default-features = false, features = ["parse", "serde", "std", "display"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
notify = "6"
regex-lite = "0.1"
base64 = "0.22"
ed25519-dalek = "3"
flate2 = "1"
fs4 = "1.1"
getrandom = "0.4"
hex = "0.4"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
url = "2"
zip = { version = "5.1", default-features = false, features = ["deflate-flate2"] }
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"

[features]
release-tool = []
# Headless PNG/JSON capture for visual review. Opt-in so release builds do not
# carry the font and image-encoding dependencies. Use `cargo snap`.
# JSON export is omitted: it pulls a serde_json newer than this crate's pinned
# lock. Add "tui-lipan/ui-snapshot-json" plus `cargo update -p serde_json` for it.
ui-snapshot = ["tui-lipan/ui-snapshot-png"]

[[bin]]
name = "hyprmux-release"
path = "tools/hyprmux-release.rs"
required-features = ["release-tool"]

[[bin]]
name = "hyprmux-launcher"
path = "src/bin/hyprmux-launcher.rs"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "terminal_ingest"
harness = false

[[bench]]
name = "snapshot_rebuild"
harness = false

[[bench]]
name = "protocol_framing"
harness = false

[[bench]]
name = "session_pipeline"
harness = false

[[bench]]
name = "app_render"
harness = false

[[bench]]
name = "scrollback_search"
harness = false

[[bench]]
name = "server_fairness"
harness = false

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[profile.release-debug]
inherits = "release"
debug = true
strip = false

[profile.release-size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev-fast]
inherits = "dev"
opt-level = 2
debug = 0
debug-assertions = false
overflow-checks = false
incremental = true
codegen-units = 16
