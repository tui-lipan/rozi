name: Docs site

# The docs/ folder is the source for rozi.tui-lipan.dev. Cloudflare Pages
# deploys it; this job only proves it still builds, which is what catches a
# renamed page breaking a cross-reference (VitePress fails on dead links).

on:
  push:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci
      - run: npm run docs:build
