# Captured with scripts/capture-agents.sh, stripped of trailing whitespace, home directory
# replaced by `~`. Claude's other screens - approval dialogs, transcripts that merely discuss
# approvals, footer versus transcript interrupt hints - are asserted inline in
# `src/agent_detection/mod.rs`, where they can also be run against another agent's rules.
source = "capture"
captured_at = "2026-08-20..2026-09-01"
notes = "Claude Code v2.1.237 first-launch cases; current-version queued-input screenshot added 2026-09-01"

# Caught, where Codex's and Copilot's equivalents were not: the option cursor starts its line, which
# is the shape Claude's own rule looks for. Kept because a first-run dialog is the single screen a
# capture run is most likely to meet, and because it is the one trust prompt of the three that a
# rule already handled - a regression here would be silent otherwise.
[[case]]
name = "startup-trust-dialog"
state = "blocked"
screen = '''
──────────────────────────────────────────────────────────────────────────────────
 Accessing workspace:

 ~/.cache/rozi-agent-lab

 Quick safety check: Is this a project you created or one you trust? (Like your own
 code, a well-known open source project, or work from your team). If not, take a
 moment to review what's in this folder first.

 Claude Code'll be able to read, edit, and execute files here.

 Security guide

 ❯ 1. Yes, I trust this folder
   2. No, exit

 Enter to confirm · Esc to cancel
'''

# The question tool, and the reason Claude needed no share of the question vocabulary the other
# agents got: its chooser is drawn with the same `❯ 1.` option cursor as its approval dialogs, so
# the rule written for one already reads the other. Worth pinning precisely because that was luck
# rather than design - narrowing the approval regex would silently drop this screen.
#
# The right-hand preview panel is Claude's own; the welcome banner above the transcript is cut
# because it carries the operator's account.
[[case]]
name = "asking-a-question"
state = "blocked"
title = "✳ Config format approach"
screen = '''
❯ Use your question tool to ask me which of two approaches I'd prefer for a config
  format. (it's a just tool test)

────────────────────────────────────────────────────────────────────────────────────────
 ☐ Config format

Which config format approach would you prefer?

❯ 1. TOML                         ┌──────────────────────────────────────────┐
  2. YAML                         │ config.toml                              │
                                  │                                          │
                                  │ [server]                                 │
                                  │ host = "0.0.0.0"                         │
                                  │ port = 8080                              │
                                  └──────────────────────────────────────────┘

                                  Notes: press n to add notes

────────────────────────────────────────────────────────────────────────────────────────
  Chat about this

Enter to select · ↑/↓ to navigate · n to add notes · Esc to cancel
'''

# A real approval prompt, from a read outside the working directory. The equivalent screens in
# `mod.rs` were written by hand; this one was watched. Note that the transcript above it already
# says `Reading ~/Projects/rozi/AGENTS.md` as though the read had happened - the agent announces the
# tool call before the gate, so nothing above the dialog distinguishes a pane that is waiting from
# one that is working.
[[case]]
name = "blocked-on-approval"
state = "blocked"
title = "✳ AGENTS.md"
screen = '''
❯ try reading ~/Projects/rozi/AGENTS.md

● Reading ~/Projects/rozi/AGENTS.md
  ⎿  ~/Projects/rozi/AGENTS.md

────────────────────────────────────────────────────────────────────────────────────────
 Read file

  Read(~/Projects/rozi/AGENTS.md)

 Do you want to proceed?
 ❯ 1. Yes
   2. Yes, allow reading from ~/Projects/rozi during this session
   3. No

 Esc to cancel · Tab to amend
'''

# Claude working, from a long answer. Two things here that a rule could have been written to rely on
# and must not be: the title animates `◑`/`✳`, which are not the braille frames the shared title
# spinner rule reads, and the composer line begins `❯` followed by a non-breaking space. What
# actually carries the state is the last line's `esc to interrupt`.
[[case]]
name = "working"
state = "working"
title = "◑ 20 common data structures"
screen = '''
  Red-Black Tree — A self-balancing binary search tree using color properties (red or
  black) on nodes to maintain approximate balance with fewer rotations than AVL trees.
  Red-black trees guarantee O(log n) search, insertion, and deletion and are more
  flexible than AVL trees for insertion-heavy scenarios. They're used in many standard
  ❯ again
─────────────────────────────────────────────────────────────────────────────────────────
❯ Press up to edit queued messages
─────────────────────────────────────────────────────────────────────────────────────────
  ⏸ manual mode on · esc to interrupt · ← for agents
'''

# Typing into Claude's composer during a live turn removes the interrupt hint from the compact
# status row and pushes the activity row beyond Rozi's eight-line footer window. Kept because this
# exact screen used to read idle and arm a false completion pulse while Claude was still streaming.
# The task text is trimmed; the activity row and everything from the live composer down is intact.
[[case]]
name = "working-with-draft-input"
state = "working"
screen = '''
✻ Jitterbugging… (27m 50s · ↓ 49.3k tokens)
  └ Tip: Use /btw to ask a quick side question without interrupting
    Claude's current work
                               Update available! Run: mise upgrade claude
─────────────────────────────────────────────────────────────────────────────────────────
❯ df
─────────────────────────────────────────────────────────────────────────────────────────
  ›› auto mode on (shift+tab to cycle)
'''

# Finished. The interrupt hint becomes `? for shortcuts`, and the run's own summary line appears.
# Kept as the negative half of the pair: the transcript still holds an answer full of prose, and
# the `❯` composer is still drawn, so nothing above the last line has changed shape.
[[case]]
name = "idle-after-turn"
state = "idle"
title = "✳ 20 common data structures"
screen = '''
  Segment Tree — A binary tree where each node aggregates information (sum, min, max)
  over a range, enabling O(log n) range queries and point updates. Segment trees solve
  dynamic range problems efficiently; for a range of n elements, a segment tree uses O(n)
  space and answers queries in O(log n). They're powerful but require careful
  implementation to handle edge cases and lazy propagation for range updates.
✻ Sautéed for 24s
─────────────────────────────────────────────────────────────────────────────────────────
❯
─────────────────────────────────────────────────────────────────────────────────────────
  ⏸ manual mode on · ? for shortcuts · ← for agents
'''
