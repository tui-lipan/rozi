# A turn in flight. Cline puts the running tool call on its own line with a spinner in front, the
# same shape its question tool uses - so the difference between this screen and the blocked one
# above is entirely in the chooser underneath, not in the spinner. The plan's numbered steps are
# kept deliberately: they sit two lines above the footer boundary and must not read as options.
[[case]]
name = "working"
state = "working"
title = "> Run bash tool to wait 300secs"
