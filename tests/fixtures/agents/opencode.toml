source = "capture"
captured_at = "2026-08-21"
notes = "OpenCode 1.18.19 under bash, 88x39 pane in the agent lab"

# OpenCode's older evidence is asserted inline in `mod.rs`, where it carries cross-agent claims a
# per-agent fixture cannot express - that Claude's dialog shape must not classify an OpenCode
# screen. These are the screens those tests do not cover: a real turn, start to finish, at the pane
# size the rest of the corpus was captured at.
#
# Read `kilo.toml` beside this file. Kilo is a fork and draws nearly the same chrome, so the pair
# is the standing proof that these two are told apart by the process behind the pane and never by
# what is drawn on it.

# Two working signals are on screen at once and only one of them counts. The braille `⠋ Thinking`
# sits in the sidebar around thirty lines up, far outside the eight-line footer window, so the
# shared braille rule cannot see it; what actually reads this screen is the `esc interrupt` hint on
# the last line. If the braille rule were ever unscoped it would start matching here for the wrong
# reason, and stop mattering when the sidebar scrolls.
[[case]]
name = "working-interrupt-hint"
state = "working"
title = "OC | Explaining 20 common data structures"
screen = '''
