[graph]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[advisories]
version = 2
yanked = "warn"
ignore = [
    # Used by tui-lipan's PNG rendering, directly and through fontdb, for `capture-pane --render
    # png`. It parses fonts installed on the machine, and only when a capture asks for an image;
    # nothing a pane prints can choose which font file is read. Revisit when fontdb and tui-lipan
    # move to a maintained parser.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained and has no safe upgrade; it only parses installed system fonts for requested PNG captures, never pane output." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Every dependency comes from the registry. Add a host here only alongside a documented
# `[patch.crates-io]` or git dependency, and remove it when that patch goes away.
# tui-lipan is pinned to an unreleased fix; see Cargo.toml.
allow-git = ["https://github.com/tui-lipan/tui-lipan"]
