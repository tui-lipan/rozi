[graph]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
# Pulled in by jsonschema through fluent-uri. A no-attribution MIT, like the 0BSD and CC0 allowed above.
exceptions = [{ allow = ["MIT-0"], crate = "borrow-or-share" }]

[bans]
multiple-versions = "allow"

[advisories]
version = 2
yanked = "warn"
ignore = [
    # Used by tui-lipan's PNG rendering, directly and through fontdb, for `capture-pane --render
    # png`. It parses fonts installed on the machine, and only when a capture asks for an image;
    # nothing a pane prints can choose which font file is read. Revisit when fontdb and tui-lipan
    # move to a maintained parser.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained and has no safe upgrade; it only parses installed system fonts for requested PNG captures, never pane output." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
