  Explain 20 common data structures, one long paragraph each. No tools, just write.

  20 Common Data Structures

  1. Array

  An array is the most fundamental data structure in computing, representing a contiguous
  block of memory divided into fixed-size slots, each holding a value of the same type and
  accessible via a numeric index in O(1) time. Arrays are the backbone of nearly every
  other data structure because random access is as cheap as arithmetic — computing the
  address of element i is simply base_address + i * element_size. The tradeoff is rigidity:
  the size is typically fixed at allocation time, and inserting or deleting an element in
  the middle requires shifting all subsequent elements, costing O(n) time. Despite this,
  arrays are cache-friendly because their sequential memory layout plays well with CPU
  prefetching and cache lines, making tight loops over arrays dramatically faster in
  practice than the same loop over a linked list, even when both are theoretically O(n).
  Dynamic arrays (like Python's list or C++'s std::vector) extend the concept by allocating
  a larger backing buffer than needed and doubling it when full, amortizing the cost of
  growth to O(1) per append while retaining O(1) random access.

  2. Linked List

