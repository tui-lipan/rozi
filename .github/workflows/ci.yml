name: CI

on:
  push:
    # Feature-branch pushes are covered by `pull_request`. Running both doubled the OS matrix
    # on every PR update. Direct pushes to master still need their own run because nightly
    # publication keys off a successful master CI. Release tags are covered by the stricter
    # test-and-package matrix in `release.yml`; running this matrix too would prove the same commit
    # twice before building every shipping target again.
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustfmt and clippy are not in the toolchain this action installs by default, and the two
      # steps below are the only reason this job needs them.
      - uses: dtolnay/rust-toolchain@49fda20b3f489226feadfba7767be1db54e2cee1 # 1.90
        with:
          toolchain: "1.90"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      # `--features windows-launcher` so the gated Windows launcher binary is still type-checked
      # while Clippy lints every target. The release-profile step below leaves it out, which is the
      # point of the gate.
      - name: Lint
        run: cargo clippy --locked --all-targets --features windows-launcher -- -D warnings
      # This includes extension argv/path probes and service child/grandchild termination tests;
      # keep it native rather than replacing the matrix with cross-compilation.
      #
      # `--no-fail-fast` because cargo otherwise stops at the first test *binary* that fails, and
      # this matrix exists to find what only breaks on one platform. A queue of macOS and Windows
      # failures once sat behind a single failing target, revealed one per push as each fix exposed
      # the next: five rounds of CI to learn what one run could have said. Individual tests inside a
      # binary are already all reported; this extends that to the targets.
      #
      # It runs even when an earlier step failed, for the same reason. Clippy findings and a
      # platform's test results are independent facts, and a lint error on Windows once meant that
      # platform reported no test results at all - the step never started, so the run said nothing
      # about the thing the matrix is for.
      - name: Test (including native process integration)
        if: ${{ !cancelled() }}
        run: cargo test --locked --no-fail-fast
      # The published control API schema is generated from the types that serialize the wire
      # format, so it can only be trusted if regenerating it is a no-op. One platform is enough:
      # the document does not vary by host.
      - name: Check the control API schema is current
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: |
          cargo test --locked --features schema-gen --lib api_schema
          cargo run --locked --features schema-gen --bin rozi-api-schema
          git diff --exit-code docs/schema/
      # Pull requests still check release-only cfg and profile behavior on every primary platform
      # without paying for optimized code generation. On master, one real optimized Linux build is
      # enough to catch release-profile failures; `release.yml` builds every shipping target before
      # publication. In particular, do not make Windows repeat its expensive MSVC ThinLTO link here.
      - name: Check release profile
        if: github.event_name == 'pull_request'
        run: cargo check --locked --release
      - name: Release build
        if: github.event_name != 'pull_request' && matrix.os == 'ubuntu-latest'
        run: cargo build --locked --release

  # NetBSD ships no rozi binary and nothing in the matrix above runs there, but it is the one
  # target that catches a whole class of `cfg` mistake those three cannot: code written as `linux`
  # versus `not(linux)`, which silently hands every other Unix the macOS spelling. That is exactly
  # how `libc::__error` reached the netbsd-likes and broke the pkgsrc build (issue #3), and neither
  # Linux, macOS nor Windows would ever have noticed.
  #
  # A plain `cargo check --target` is not enough here: `ring` builds C, so this needs a NetBSD C
  # toolchain, and `cross` carries one in its image. Compilation only: a green tick here says the
  # code still builds for NetBSD, nothing more. Whether it runs is checked weekly by
  # `netbsd.yml` against a real NetBSD VM.
  netbsd-cross:
    name: netbsd cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@49fda20b3f489226feadfba7767be1db54e2cee1 # 1.90
        with:
          toolchain: "1.90"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cross
        run: cargo install cross --locked --version 0.2.5
      - name: Check
        run: cross check --locked --all-targets --target x86_64-unknown-netbsd
      - name: Lint
        run: cross clippy --locked --all-targets --target x86_64-unknown-netbsd -- -D warnings

  # The OpenCode plugin is the authoritative status source for a pane running OpenCode, and it
  # ships in this repository with its own tests. Linux only: it is platform-independent JavaScript,
  # so running it on all three would only buy a slower matrix.
  integrations:
    name: integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the OpenCode status plugin
        run: node --test integrations/opencode/*.test.mjs

  licenses:
    name: licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check licenses, sources, advisories, and bans
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses sources advisories bans
