[package]
name = "hyprmux"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Hyprland-style tiling terminal multiplexer built on tui-lipan"

[dependencies]
tui-lipan = { version = "0.1", path = "../tui-lipan", features = ["terminal", "terminal-serde", "theme-reload"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[profile.release-debug]
inherits = "release"
debug = true
strip = false
