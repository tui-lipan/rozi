name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# tui-lipan is still a path dep, so its checkout stays explicit; this is not a crates.io fallback or
# a claim that standalone CI can build the current manifest.  relswap comes from the registry
# instead, so Cargo.lock pins the exact engine each signed release was built and signed with.
permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out hyprmux beside its path dependency
        uses: actions/checkout@v4
        with:
          path: hyprmux
      - name: Check out the sibling tui-lipan dependency
        uses: actions/checkout@v4
        with:
          repository: tui-lipan/tui-lipan
          path: tui-lipan
      - uses: dtolnay/rust-toolchain@1.90
      # Deliberately not `--all-targets`: that also *runs* the bench binaries, so a release was
      # gated on timing-sensitive benchmarks racing a shared runner - server_fairness synchronises
      # with a helper thread on a deadline and lost that race here. Benchmarks measure, they do not
      # decide whether a build ships.
      - name: Test
        working-directory: hyprmux
        run: cargo test --locked
      # Keep the compile coverage `--all-targets` was there for, without executing anything.
      - name: Check every target compiles
        working-directory: hyprmux
        run: cargo check --locked --all-targets

  package:
    name: package ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Check out hyprmux beside its path dependency
        uses: actions/checkout@v4
        with:
          path: hyprmux
      - name: Check out the sibling tui-lipan dependency
        uses: actions/checkout@v4
        with:
          repository: tui-lipan/tui-lipan
          path: tui-lipan
      - uses: dtolnay/rust-toolchain@1.90
        with:
          targets: ${{ matrix.target }}

      - name: Resolve package version
        id: version
        working-directory: hyprmux
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c \
              'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build payload
        working-directory: hyprmux
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build Windows launcher
        if: matrix.archive == 'zip'
        working-directory: hyprmux
        run: cargo build --locked --release --target ${{ matrix.target }} --bin hyprmux-launcher

      - name: Smoke-test payload version
        working-directory: hyprmux
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/hyprmux"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then binary="$binary.exe"; fi
          "$binary" --version | grep -F "${{ steps.version.outputs.version }}"
          "$binary" --help >/dev/null

      - name: Package canonical archive
        id: package
        working-directory: hyprmux
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          stem="hyprmux-${version}-${{ matrix.target }}"
          mkdir -p "dist/${stem}"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            cp "target/${{ matrix.target }}/release/hyprmux.exe" "dist/${stem}/hyprmux.exe"
            cp "target/${{ matrix.target }}/release/hyprmux-launcher.exe" \
              "dist/${stem}/hyprmux-launcher.exe"
          else
            cp "target/${{ matrix.target }}/release/hyprmux" "dist/${stem}/hyprmux"
          fi
          cp README.md LICENSE-APACHE LICENSE-MIT "dist/${stem}/"
          cp -R examples "dist/${stem}/examples"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd dist && 7z a -tzip "${stem}.zip" "$stem" >/dev/null)
          else
            tar -czf "dist/${stem}.tar.gz" -C dist "$stem"
          fi
          rm -rf "dist/${stem}"

      - name: Smoke-test extracted final archive
        working-directory: hyprmux
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          stem="hyprmux-${version}-${{ matrix.target }}"
          mkdir -p dist/verify
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z x "dist/${stem}.zip" -odist/verify >/dev/null
            "dist/verify/${stem}/hyprmux.exe" --version | grep -F "$version"
            test -x "dist/verify/${stem}/hyprmux-launcher.exe" || \
              test -f "dist/verify/${stem}/hyprmux-launcher.exe"
          else
            tar -xzf "dist/${stem}.tar.gz" -C dist/verify
            "dist/verify/${stem}/hyprmux" --version | grep -F "$version"
          fi

      - name: Smoke-test Windows launcher-v1
        if: matrix.archive == 'zip'
        working-directory: hyprmux
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $stem = "hyprmux-$version-${{ matrix.target }}"
          $smokeRoot = Join-Path $env:RUNNER_TEMP ('hyprmux-launcher-smoke-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $smokeRoot -Force | Out-Null
          Write-Host "smoke: version=$version stem=$stem cwd=$(Get-Location)"
          Write-Host "smoke: archive present=$(Test-Path -LiteralPath "dist/$stem.zip")"
          try {
              $archiveRoot = Join-Path $smokeRoot 'archive'
              New-Item -ItemType Directory -Path $archiveRoot -Force | Out-Null
              & 7z x "dist/$stem.zip" "-o$archiveRoot" -y | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'could not unpack the final Windows archive for smoke testing' }
              Write-Host "smoke: phase=unpacked"
              $packagedRoot = Join-Path $archiveRoot $stem
              $packagedPayload = Join-Path $packagedRoot 'hyprmux.exe'
              $packagedLauncher = Join-Path $packagedRoot 'hyprmux-launcher.exe'
              if (-not (Test-Path -LiteralPath $packagedPayload -PathType Leaf)) { throw 'packaged payload is missing' }
              if (-not (Test-Path -LiteralPath $packagedLauncher -PathType Leaf)) { throw 'packaged launcher is missing' }

              $managedRoot = Join-Path $smokeRoot 'managed'
              $managedBin = Join-Path $managedRoot 'bin'
              $managedVersion = Join-Path (Join-Path $managedRoot 'versions') $version
              New-Item -ItemType Directory -Path $managedBin, $managedVersion -Force | Out-Null
              $launcher = Join-Path $managedBin 'hyprmux.exe'
              Copy-Item -LiteralPath $packagedLauncher -Destination $launcher
              Copy-Item -LiteralPath $packagedPayload -Destination (Join-Path $managedVersion 'hyprmux.exe')
              [IO.File]::WriteAllText(
                  (Join-Path $managedRoot 'active'),
                  $version,
                  [Text.UTF8Encoding]::new($false)
              )
              Write-Host "smoke: phase=layout-built"
              $versionOutput = (& $launcher --version 2>&1 | Out-String)
              $versionLine = ($versionOutput -split "`r?`n", 2)[0]
              if ($LASTEXITCODE -ne 0 -or $versionLine -cne "hyprmux $version") {
                  throw "launcher-v1 did not execute the packaged payload: $versionOutput"
              }

              Write-Host "smoke: phase=version-ok"
              $forwardRoot = Join-Path $smokeRoot 'forwarding'
              $forwardBin = Join-Path $forwardRoot 'bin'
              $forwardVersion = Join-Path (Join-Path $forwardRoot 'versions') '0.0.0'
              $forwardCwd = Join-Path $forwardRoot 'cwd'
              New-Item -ItemType Directory -Path $forwardBin, $forwardVersion, $forwardCwd -Force | Out-Null
              $forwardLauncher = Join-Path $forwardBin 'hyprmux.exe'
              Copy-Item -LiteralPath $packagedLauncher -Destination $forwardLauncher
              $cmdPayload = Join-Path $forwardVersion 'hyprmux.exe'
              Copy-Item -LiteralPath (Join-Path $env:WINDIR 'System32\cmd.exe') -Destination $cmdPayload
              [IO.File]::WriteAllText(
                  (Join-Path $forwardRoot 'active'),
                  '0.0.0',
                  [Text.UTF8Encoding]::new($false)
              )
              $oldSmokeEnv = $env:HYPRMUX_LAUNCHER_SMOKE
              try {
                  $env:HYPRMUX_LAUNCHER_SMOKE = 'forwarded-env'
                  Push-Location $forwardCwd
                  try {
                      $command = 'echo forwarded-argument & echo %HYPRMUX_LAUNCHER_SMOKE% & cd & exit 37'
                      $forwardOutput = (& $forwardLauncher '/d' '/c' $command 2>&1 | Out-String)
                      $forwardExitCode = $LASTEXITCODE
                  } finally {
                      Pop-Location
                  }
              } finally {
                  if ($null -eq $oldSmokeEnv) {
                      Remove-Item Env:HYPRMUX_LAUNCHER_SMOKE -ErrorAction SilentlyContinue
                  } else {
                      $env:HYPRMUX_LAUNCHER_SMOKE = $oldSmokeEnv
                  }
              }
              Write-Host "smoke: phase=forward-ran exit=$forwardExitCode"
              if ($forwardExitCode -ne 37) {
                  throw "launcher-v1 did not propagate cmd.exe exit code 37: $forwardExitCode"
              }
              if ($forwardOutput -notmatch 'forwarded-argument') {
                  throw "launcher-v1 did not forward the command arguments: $forwardOutput"
              }
              if ($forwardOutput -notmatch 'forwarded-env') {
                  throw "launcher-v1 did not forward the environment: $forwardOutput"
              }
              if ($forwardOutput -notmatch [regex]::Escape($forwardCwd)) {
                  throw "launcher-v1 did not forward the working directory: $forwardOutput"
              }
              Write-Host "smoke: phase=all-checks-passed"
          } catch {
              # Without this the step can end as a bare "exit code 1" with nothing printed, which
              # says only that the launcher contract broke somewhere in eighty lines of setup.
              Write-Host "smoke: FAILED - $($_.Exception.Message)"
              Write-Host "smoke: at $($_.InvocationInfo.PositionMessage)"
              Write-Host "smoke: stack $($_.ScriptStackTrace)"
              throw
          } finally {
              # Best-effort: the payload was executed moments ago, and a still-closing handle would
              # otherwise replace the real failure with a cleanup error.
              if (Test-Path -LiteralPath $smokeRoot) {
                  Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
              }
          }
          Write-Host "smoke: done LASTEXITCODE=$LASTEXITCODE"
          exit 0

      - name: Upload immutable final archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: |
            hyprmux/dist/*.tar.gz
            hyprmux/dist/*.zip
          if-no-files-found: error
          overwrite: false
          retention-days: 14

      # Build this only on the native Linux runner. Publication downloads this executable and never
      # invokes Cargo after the protected private-key step.
      #
      # The version is read from Cargo.lock rather than written here: the tool that produces a
      # manifest and the engine that verifies it share a wire format (schema_version), so they must
      # be the same release of relswap. Pinning it in two places would let them drift apart, and the
      # failure would only appear on a client mid-update.
      - name: Build Linux release tool
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: hyprmux
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version 1 --locked \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="relswap"))')
          test -n "$version"
          echo "Building release tool from relswap $version"
          cargo install relswap --version "=$version" --locked --features release-tool \
            --root "$RUNNER_TEMP/release-tool"

      - name: Upload prebuilt Linux release tool
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: release-tool-linux
          path: ${{ runner.temp }}/release-tool/bin/relswap
          if-no-files-found: error
          overwrite: false
          retention-days: 14

  sign_release:
    name: sign verified release
    needs: [test, package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4

      - name: Download completed archives
        uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: Download prebuilt Linux release tool
        uses: actions/download-artifact@v4
        with:
          name: release-tool-linux
          path: release-tool

      - name: Prepare tool
        shell: bash
        run: chmod 0755 release-tool/relswap

      - name: Check tag, package, and final archive version before secret use
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]
          package_version="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("Cargo.toml").read_text()
          match = re.search(r"(?ms)^\[package\].*?^version\s*=\s*[\"']([^\"']+)[\"']", text)
          if not match:
              raise SystemExit("Cargo.toml package.version is missing")
          print(match.group(1))
          PY
          )"
          test "$version" = "$package_version" || {
            echo "tag v$version does not match Cargo.toml package.version $package_version" >&2
            exit 1
          }
          test -n "$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit)"
          for archive in \
            "hyprmux-${version}-x86_64-unknown-linux-gnu.tar.gz" \
            "hyprmux-${version}-aarch64-unknown-linux-gnu.tar.gz" \
            "hyprmux-${version}-x86_64-apple-darwin.tar.gz" \
            "hyprmux-${version}-aarch64-apple-darwin.tar.gz" \
            "hyprmux-${version}-x86_64-pc-windows-msvc.zip"; do
            test -f "dist/$archive" || {
              echo "completed artifact is missing: $archive" >&2
              exit 1
            }
          done

      # This is intentionally before the signing step. release-keys.json starts empty until the
      # maintainer generates release-2026-a; no protected secret is read when this fails.
      - name: Fail closed if the committed trust store is empty
        shell: bash
        run: release-tool/relswap trust-check --keys release-keys.json

      - name: Generate hashes and manifest from final artifact bytes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          release-tool/relswap manifest \
            --name hyprmux \
            --version "$version" \
            --artifacts-dir dist \
            --output dist/hyprmux-release.json
          python3 - "$version" <<'PY'
          import json
          import sys
          from datetime import datetime
          manifest = json.load(open("dist/hyprmux-release.json", encoding="utf-8"))
          assert set(manifest) == {"schema_version", "version", "published_at", "expires_at", "targets"}
          assert manifest["schema_version"] == 2
          assert manifest["version"] == sys.argv[1]
          assert manifest["published_at"].endswith("Z")
          datetime.fromisoformat(manifest["published_at"].replace("Z", "+00:00"))
          assert manifest["expires_at"].endswith("Z")
          datetime.fromisoformat(manifest["expires_at"].replace("Z", "+00:00"))
          assert set(manifest["targets"]) == {
              "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
              "x86_64-apple-darwin", "aarch64-apple-darwin",
              "x86_64-pc-windows-msvc",
          }
          PY
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          linux_stem="hyprmux-${version}-x86_64-unknown-linux-gnu"
          tar -xzf "dist/${linux_stem}.tar.gz" -C "$verify_dir"
          "$verify_dir/${linux_stem}/hyprmux" --version | grep -F "$version"

      # The environment is protected, but the private value is deliberately scoped to this one
      # step. No Cargo command, compiler, or checkout runs after it becomes available.
      # RELSWAP_RELEASE_PRIVATE_KEY is the name the (product-neutral) release tool reads; the
      # repository secret keeps its hyprmux-scoped name. The key id is hyprmux's own and is passed
      # as an argument, so it stays named for this product.
      - name: Sign exact manifest bytes
        env:
          RELSWAP_RELEASE_PRIVATE_KEY: ${{ secrets.HYPRMUX_RELEASE_PRIVATE_KEY }}
          HYPRMUX_RELEASE_KEY_ID: ${{ vars.HYPRMUX_RELEASE_KEY_ID || 'release-2026-a' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELSWAP_RELEASE_PRIVATE_KEY"
          test -n "$HYPRMUX_RELEASE_KEY_ID"
          release-tool/relswap sign \
            --name hyprmux \
            --manifest dist/hyprmux-release.json \
            --output dist/hyprmux-release.signatures.json \
            --key-id "$HYPRMUX_RELEASE_KEY_ID"

      - name: Verify signature and every final archive before publication
        shell: bash
        run: |
          set -euo pipefail
          release-tool/relswap verify \
            --name hyprmux \
            --manifest dist/hyprmux-release.json \
            --signatures dist/hyprmux-release.signatures.json \
            --keys release-keys.json \
            --artifacts-dir dist

      - name: Upload verified publication bundle
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-bundle
          path: |
            dist/hyprmux-release.json
            dist/hyprmux-release.signatures.json
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          overwrite: false
          retention-days: 14

  publish:
    name: publish verified release
    needs: sign_release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.sign_release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified publication bundle
        uses: actions/download-artifact@v4
        with:
          name: verified-release-bundle
          path: dist

      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "v$version" \
            --repo "$GITHUB_REPOSITORY" \
            dist/hyprmux-release.json \
            dist/hyprmux-release.signatures.json \
            dist/*.tar.gz \
            dist/*.zip \
            dist/*.sha256 \
            --verify-tag \
            --generate-notes
