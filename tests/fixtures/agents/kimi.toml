source = "capture"
captured_at = "2026-08-21"
notes = "Kimi Code 0.38.0 under bash, 88x39 pane in the agent lab"

# Kimi is read by the shared footer rule alone, and this pins where that works. Its spinner sits
# between the transcript and the input box rather than riding the line being written, so it holds a
# fixed six lines from the bottom for the whole turn instead of drifting up out of the footer the
# way Cline's does. That difference is the entire reason Cline needed a rule and Kimi does not.
[[case]]
name = "working-thinking"
state = "working"
screen = '''
 ╭───────────────────────────────────────────────────────────────────────────────────────╮
 │  ▐█▛█▛█▌  Welcome to Kimi Code!                                                       │
 │  ▐█████▌  Send /help for help information.                                            │
 │  Directory: ~/.cache/rozi-agent-lab                                                   │
 │  Model:     Gemini 3.5 Flash Lite                                                     │
 ╰───────────────────────────────────────────────────────────────────────────────────────╯

 ✦ Explain 20 common data structures, one long paragraph each. No tools, just write.

 ⠏ thinking...


 ╭───────────────────────────────────────────────────────────────────────────────────────╮
 │ >                                                                                     │
 ╰───────────────────────────────────────────────────────────────────────────────────────╯
 Gemini 3.5 Flash Lite thinking: medium  ~/.cache/rozi-agent-lab
                                                                        context: 0% (0/1M)
'''

# The startup screen. `Send /help for help information` and an empty prompt box are the whole of
# it, and the context line spells out a percentage - none of which is work. Kept as the negative
# for anything new that reads a status bar as activity.
[[case]]
name = "idle-splash"
state = "idle"
screen = '''
 ╭───────────────────────────────────────────────────────────────────────────────────────╮
