# Captured with scripts/capture-agents.sh, stripped of trailing whitespace, home directory
# replaced by `~`. Rules match substrings, so neither edit changes what they read.
source = "capture"
captured_at = "2026-08-20"
notes = "codex CLI, first launch in an unseen directory"

# A pane waiting for permission looks perfectly quiet, which is the worst way for detection to be
# wrong: nothing on this screen said "blocked" before the shared vocabulary learned the phrasing.
# Note what does *not* catch it - the option cursor is `›`, not Claude's `❯`, and the question is
# about trust rather than proceeding.
[[case]]
name = "startup-trust-dialog"
state = "blocked"
screen = '''
> You are in ~/.cache/rozi-agent-lab

  Do you trust the contents of this directory? Working with untrusted contents comes with higher risk of prompt injection. Trusting the directory allows project-local config, hooks, and exec policies to load.

› 1. Yes, continue
  2. No, quit

  Press enter to continue
'''

# Captured from Codex 0.166.0 on 2026-11-02 in an unseen repository, nothing pressed. It read as
# idle, so `agents prompt` typed into it and its Enter answered the question: a script could trust a
# folder for someone without anyone seeing it ask. Codex asked this in a repository and not in a
# plain directory.
[[case]]
name = "startup-folder-access-dialog"
state = "blocked"
screen = '''
  Folder access

  /tmp/rzl-tl/projects/codex3

  Trust this folder? Codex can read, edit, and run files here, subject to your
  permission settings. Folder settings can run code automatically, even without a
  model request. Continue only if you trust these files. Your trust decision will be
  saved.

› 1. Trust and continue
  2. Back to Agent Command Center

  enter continue · esc back
'''

# Captured from Codex 0.166.0 on 2026-11-02, resuming a conversation from another directory, nothing
# pressed. It read as idle, so `agents prompt` would type into it, and its Enter would choose a
# directory. Two of the options save a permanent preference. Rozi's own restores can reach it: a
# resume runs where the pane restored to, and the conversation may have moved since.
[[case]]
name = "resume-working-directory-dialog"
state = "blocked"
screen = '''
  Working directory · resume

  Session = latest cwd recorded in the resumed session
  Current = your current working directory

› 1. Use session directory (/tmp/rzl-tl/projects/cnd1)
  2. Use current directory (/tmp/rzl-tl/projects/cdd1)
  3. Always use session directory
  4. Always use current directory

  enter continue · esc use session · ^c quit
'''

# Captured from Codex 0.166.0 on 2026-11-02 with a trusted plugin's script changed, nothing pressed; with
# it unchanged Codex does not ask. So any update to a plugin with hooks can put this in front of a pane.
# It read as idle, so `agents prompt` typed into it and its Enter chose an option. Its title is empty,
# and its footer hint differs from the folder access dialog's.
[[case]]
name = "hooks-need-review-dialog"
state = "blocked"
screen = '''
  Hooks need review
  10 hooks are new or changed.
  Hooks can run outside the sandbox after you trust them.


› 1. Review hooks
  2. Trust all and continue
  3. Continue without trusting (hooks won't run)

  enter confirm · esc skip
'''

# Captured from Codex 0.166.0 on 2026-11-02 on gpt-6-luna at 88x39, in a read-only sandbox, nothing
# pressed. Hooks report this state only under `--no-daemon`, so for a plain `codex` only detection
# says the pane is waiting, and nothing in this screen's text does: the title carries it alone. Read
# as idle, `agents prompt` would type into the dialog and its Enter would run the command. The
# transcript above the prompt is cut.
[[case]]
name = "approval-to-run-a-command"
state = "blocked"
title = "[ . ] Action Required | Create marker.txt | cxa"
screen = '''
› Create an empty file named marker.txt in this directory with the touch command. Do
  nothing else.


• The filesystem is read-only here, so I’m requesting the required write access to run
  exactly touch marker.txt in this directory.

• Running touch marker.txt


  Would you like to run the following command?

  Environment: local

  Reason: May I create marker.txt here with the requested touch command?

  $ touch marker.txt


› 1. Yes, proceed (y)
  2. Yes, and don't ask again for commands that start with `touch marker.txt` (p)
  3. No, and tell Codex what to do differently (esc)

  Press enter to confirm or esc to cancel
'''

# Captured while the agent's question tool held the pane. The transcript above the chooser is cut;
# trailing whitespace stripped, home directory replaced by `~`.
[[case]]
name = "asking-a-question"
state = "blocked"
title = "[ . ] Action Required | rozi-agent-lab"
screen = '''
╰───────────────────────────────────────────────────╯
  Tip: Press Tab to queue a message when a task is running; otherwise it sends
  immediately (except !).
› testing purposes: can you use the question tool and ask me any question?
• The question tool is only available in Plan mode, so I can’t invoke it here.
  Plainly: what’s your favorite color?
› testing purposes: can you use the question tool and ask me any question?
  Question 1/1 (1 unanswered)
  Which drink do you prefer?
  › 1. Coffee (Recommended)  Choose coffee.
    2. Tea                   Choose tea.
    3. Water                 Choose water.
    4. None of the above     Optionally, add details in notes (tab).
  tab to add notes | enter to submit answer | esc to interrupt
'''

# A turn in flight, from a `sleep 300` in the background. Two independent signals agree here, which
# is worth keeping: the title carries a braille spinner and the status line carries an interrupt
# hint, so Codex stays readable if either convention changes under it.
[[case]]
name = "working"
state = "working"
title = "⠼ rozi-agent-lab"
screen = '''
› Run bash tool to wait 300secs


• I'll start a 300-second bash wait and keep it monitored in shorter intervals.

• Working (24s • esc to interrupt) · 1 background terminal running · /ps to view · /sto…


› Ask Codex to do anything

  gpt-5.6-luna medium · ~/.cache/rozi-agent-lab
'''

