source = "capture"
captured_at = "2026-08-21"
notes = "Kilo CLI 7.4.23 under bash, 88x39 pane in the agent lab"

# Kilo is an OpenCode fork and draws OpenCode's chrome almost line for line - the same sidebar, the
# same block-dot progress meter, the same `esc interrupt` hint. That is why these screens are worth
# holding on both sides: the two agents are told apart by the process behind the pane, never by
# what is on it, and a rule that tried to separate them by screen text would have to fail here.
#
# This one is read by the shared `esc interrupt` needle, not by anything Kilo-specific.
[[case]]
name = "working-interrupt-hint"
state = "working"
title = "Kilo CLI | 20 Common Data Structures Overview"
screen = '''
  ┃                                                                                               20 Common Data Structures Overview
  ┃  Explain 20 common data structures, one long paragraph each. No tools, just write.
  ┃
                                                                                                  ▼ Context
     ▣  Code · Auto Free                                                                          0 tokens
                                                                                                  0% used
                                                                                                  $0.00 spent

                                                                                                  Code Indexing
                                                                                                  • Disabled

  ┃
  ┃
  ┃
  ┃  Code  · Auto Free Kilo Gateway                                                               ~/.cache/rozi-agent-lab
  ╹▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀
