'''

# The startup screen, and the first thing anyone here has seen Kilo draw: the entry in
# AWAITING_EVIDENCE said it came up blank, which turns out to have been the capture arriving before
# it had finished starting rather than anything wrong with a spawned PTY.
#
# It carries a notice about an OpenCode config directory, which is exactly the kind of prose that
# would let a fork be misread as the tool it forked from if any rule ever matched on words.
[[case]]
name = "idle-splash"
state = "idle"
title = "Kilo CLI"
