[graph]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[advisories]
version = 2
yanked = "warn"
ignore = [
    # Pulled through fontdue/fontdb by tui-lipan's opt-in PNG snapshot support. It parses bundled
    # and system fonts during trusted development captures, not untrusted terminal input. Revisit
    # when fontdue/fontdb migrate to a maintained parser.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained and has no safe upgrade; usage is limited to trusted development captures." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/helix-editor/termina",
    # Temporary, exactly as long as `relswap` in Cargo.toml is a git revision: 0.0.8 adds
    # `UreqDownloader::with_progress` and is not yet on crates.io. Remove this entry in the same
    # change that restores `relswap = "0.0.8"` - an allow-listed git source for the crate that
    # verifies and activates signed releases is not something to leave standing by accident.
    "https://github.com/tui-lipan/relswap",
]
