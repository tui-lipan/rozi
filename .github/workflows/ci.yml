name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out hyprmux beside path dependencies
        uses: actions/checkout@v4
        with:
          path: hyprmux
      - name: Check out the sibling tui-lipan dependency
        uses: actions/checkout@v4
        with:
          repository: tui-lipan/tui-lipan
          path: tui-lipan
      # rustfmt and clippy are not in the toolchain this action installs by default, and the two
      # steps below are the only reason this job needs them.
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hyprmux
      - name: Check formatting
        working-directory: hyprmux
        run: cargo fmt --all -- --check
      - name: Check
        working-directory: hyprmux
        run: cargo check --locked --all-targets
      - name: Lint
        working-directory: hyprmux
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        working-directory: hyprmux
        run: cargo test --locked
      - name: Release build
        working-directory: hyprmux
        run: cargo build --locked --release

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out hyprmux beside path dependencies
        uses: actions/checkout@v4
        with:
          path: hyprmux
      - name: Check out the sibling tui-lipan dependency
        uses: actions/checkout@v4
        with:
          repository: tui-lipan/tui-lipan
          path: tui-lipan
      - uses: dtolnay/rust-toolchain@1.88
      # RustSec advisories are a property of the dependency graph, not of the host, so auditing on
      # all three platforms would report the same findings three times and pay for `cargo install`
      # three times over.
      - name: Audit dependencies
        working-directory: hyprmux
        run: cargo install cargo-audit --locked && cargo audit
