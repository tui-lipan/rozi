# Point the `website` branch at the release users install.
#
# rozi.tui-lipan.dev deploys from `website`, not `master`, so the documentation describes the
# latest release rather than work that has not shipped. The install scripts the site serves come
# from the same commit, so they always match the published binaries.
#
# After a successful release this moves `website` to the release tag.
#
# To publish documentation before the next release, run it by hand with `commits`: the commits
# from master to apply on top of the latest release, oldest first, or a range such as
# `v0.0.34..master`. Each must touch only docs/, README.md, assets/, or tools/docs-captures/ - the
# site also serves install.sh and install.ps1 and counts features out of src/, and those must stay
# the release's. A commit already in the release is skipped. Run it with `ref` alone to publish
# another commit, tag, or branch as it is. Never pass `master` as `ref` - it describes unreleased
# work.
name: Website

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag, or branch to publish (default: the latest release)"
        required: false
        default: ""
      commits:
        description: "Documentation commits to apply on top of it, oldest first, or a range such as v0.0.34..master"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  publish:
    name: move website to the release
    # A release run also happens for pull requests that touch release files; only a tag push
    # publishes anything.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - name: Choose the commit to publish
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.ref }}
          RELEASED: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          ref="${REQUESTED:-$latest}"

          # A release run for an older tag finishing late must not move the site backwards.
          if [ "$GITHUB_EVENT_NAME" = workflow_run ] && [ "$ref" != "$RELEASED" ]; then
            echo "latest release is $latest; leaving website alone"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$ref" --jq .sha)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Move the website branch
        if: steps.base.outputs.skip != 'true' && inputs.commits == ''
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.base.outputs.ref }}
          SHA: ${{ steps.base.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/website" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/website" \
              -f sha="$SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/heads/website -f sha="$SHA" >/dev/null
          fi
          echo "website now at $REF ($SHA)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.base.outputs.skip != 'true' && inputs.commits != ''
        with:
          ref: ${{ steps.base.outputs.sha }}
          fetch-depth: 0

      - name: Apply the documentation commits and publish them
        if: steps.base.outputs.skip != 'true' && inputs.commits != ''
        env:
          REF: ${{ steps.base.outputs.ref }}
          COMMITS: ${{ inputs.commits }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"

          # Expand ranges, oldest first, and check every commit before applying any.
          picks=()
          for item in $COMMITS; do
            if [[ "$item" == *..* ]]; then
              mapfile -t range < <(git rev-list --reverse --no-merges "$item")
              picks+=("${range[@]}")
            else
              picks+=("$(git rev-parse --verify "$item^{commit}")")
            fi
          done

          for commit in "${picks[@]}"; do
            # Already published with the release; nothing of it is left to check.
            git merge-base --is-ancestor "$commit" HEAD && continue
            outside="$(git diff-tree --no-commit-id --name-only -r "$commit" \
              | grep -Ev '^(docs/|README\.md$|assets/|tools/docs-captures/)' || true)"
            if [ -n "$outside" ]; then
              echo "::error::$(git log -1 --format='%h %s' "$commit") changes more than documentation:"
              echo "$outside"
              exit 1
            fi
          done

          applied=0
          for commit in "${picks[@]}"; do
            if git merge-base --is-ancestor "$commit" HEAD; then
              echo "already in $REF: $(git log -1 --format='%h %s' "$commit")"
            else
              git cherry-pick "$commit"
              applied=$((applied + 1))
            fi
          done

          git push --force origin HEAD:refs/heads/website
          echo "website now at $REF plus $applied documentation commit(s) ($(git rev-parse HEAD))"
