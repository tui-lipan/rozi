# Example: a two-panel sidebar with built-in, launcher, and command tabs.
#
# Copy this table into ~/.config/rozi/config.toml and adjust commands to
# match the tools available in your shell.

[sidebar]
startup = true
tabs = [
  "activity",
  "agents",
  "panes",
  "sessions",
  "files",
  "git",
  "worktrees",
  { name = "dev", label = "Dev", entries = [
    { label = "Run tests", run = "cargo test" },
    { label = "Check", send = "cargo check\n" },
    { label = "Git UI", popup = "lazygit", keep_open = false },
  ] },
  {
    name = "branches",
    label = "Branches",
    command = "git branch --format='%(refname:short)'",
    interval = 15,
  },
  # Grouped launcher: one section per agent, one row per project. Clicking a row opens a pane
  # running that agent in that directory.
  { name = "launch", label = "Launch", entries = [
    { label = "rozi", group = "claude", run = "cd ~/Projects/rozi && claude" },
    { label = "docs", group = "claude", run = "cd ~/Projects/docs && claude" },
    { label = "rozi", group = "codex", run = "cd ~/Projects/rozi && codex" },
  ] },
  # Grouped command tab: the command emits its own section headers, marked with `## `. Here each
  # remote becomes a section, with its branches under it.
  {
    name = "remotes",
    label = "Remotes",
    command = "git for-each-ref --format='%(refname:lstrip=2)' refs/remotes | awk -F/ '$1 != r {r = $1; print \"## \" r} {print}'",
    interval = 30,
    group_prefix = "## ",
    on_click = { send = "{line}" },
  },
  # JSON command tab: the command prints {"rows":[...]}, rows nest under their `parent`, and a
  # row's `tone` picks its marker. A run/popup/exec action gets the clicked row's id in
  # $ROZI_ROW_ID; `send` types the row's label for {line}.
  {
    name = "todo",
    label = "TODO",
    command = "rg --json TODO | jq -nc '{rows: [inputs | select(.type == \"end\") | {id: .data.path.text, label: .data.path.text, description: (.data.stats.matches | tostring), tone: \"warning\"}]}'",
    format = "json",
    on_click = { send = "{line}" },
  },
  # Stream tab: rows come from running programs, published with
  # `some-watcher | rozi sidebar publish --tab deploys`.
  { name = "deploys", label = "Deploys", stream = true },
]
layout = { left = { width = 38, panel_count = 2, panels = [
  { weight = 0.62, tabs = ["activity", "agents", "panes", "files", "git", "worktrees"] },
  { weight = 0.38, tabs = ["sessions", "dev", "branches", "launch", "remotes", "todo", "deploys"] },
] }, right = { width = 32, panel_count = 1, panels = [{ weight = 1.0, tabs = [] }] }, hidden = [] }

# Built-in tabs take their settings here; Sidebar tabs… → ctrl+e edits them in the app.
[sidebar.settings.activity]
worktrees = "repository"

[sidebar.settings.files]
explorer = true
