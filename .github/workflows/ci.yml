name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out rozi beside path dependencies
        uses: actions/checkout@v4
        with:
          path: rozi
      - name: Check out the sibling tui-lipan dependency
        uses: actions/checkout@v4
        with:
          repository: tui-lipan/tui-lipan
          path: tui-lipan
      # rustfmt and clippy are not in the toolchain this action installs by default, and the two
      # steps below are the only reason this job needs them.
      - uses: dtolnay/rust-toolchain@1.90
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rozi
      - name: Check formatting
        working-directory: rozi
        run: cargo fmt --all -- --check
      - name: Check
        working-directory: rozi
        run: cargo check --locked --all-targets
      - name: Lint
        working-directory: rozi
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        working-directory: rozi
        run: cargo test --locked
      - name: Release build
        working-directory: rozi
        run: cargo build --locked --release

  # The OpenCode plugin is the authoritative status source for a pane running OpenCode, and it
  # ships in this repository with its own tests. Linux only: it is platform-independent JavaScript,
  # so running it on all three would only buy a slower matrix.
  integrations:
    name: integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the OpenCode status plugin
        run: node --test integrations/opencode/*.test.mjs

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out rozi beside path dependencies
        uses: actions/checkout@v4
        with:
          path: rozi
      - name: Check out the sibling tui-lipan dependency
        uses: actions/checkout@v4
        with:
          repository: tui-lipan/tui-lipan
          path: tui-lipan
      - uses: dtolnay/rust-toolchain@1.90
      # RustSec advisories are a property of the dependency graph, not of the host, so auditing on
      # all three platforms would report the same findings three times and pay for `cargo install`
      # three times over.
      - name: Audit dependencies
        working-directory: rozi
        run: cargo install cargo-audit --locked && cargo audit
