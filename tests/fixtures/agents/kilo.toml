# The one thing Kilo and OpenCode ask about that the shared vocabulary already caught: both spell
# out `△ Permission required` in the transcript, ten lines up, which the unscoped needle reaches.
# Kept on both because it is the counter-example to the three agents captured beside it - omp,
# Kimi and Kiro all sat on an approval dialog reading idle because they never say the word.
#
# The filename is redacted to the same length; it came from a real Downloads folder.
