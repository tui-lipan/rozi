[package]
name = "hyprmux"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Hyprland-style tiling terminal multiplexer built on tui-lipan"

[dependencies]
tui-lipan = { path = "../tui-lipan/", features = [
  "terminal",
  "terminal-serde",
  "theme-reload",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
notify = "6"
regex-lite = "0.1"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "terminal_ingest"
harness = false

[[bench]]
name = "snapshot_rebuild"
harness = false

[[bench]]
name = "protocol_framing"
harness = false

[[bench]]
name = "session_pipeline"
harness = false

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[profile.release-debug]
inherits = "release"
debug = true
strip = false
