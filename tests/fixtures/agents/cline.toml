# Streaming an answer, which is the screen that made Cline's unscoped spinner rule necessary. The
# spinner is at the head of the paragraph being written, and everything below it - eight non-empty
# lines of queued-message box, input box and status - is chrome. Read through the shared
# footer-scoped rule this whole minute was idle. Prose lines are truncated; the structure is not.
[[case]]
name = "working-while-streaming-an-answer"
state = "working"
title = "> Explain 12 sorting algorithms, one long paragraph each. No tools, just write."
