# The same permission dialog Kilo draws, which is the point of keeping it on both: the fork and the
# original are indistinguishable here, right down to the closing line, and the only thing telling
# these two panes apart is the process behind them.
#
# Read beside omp, Kimi and Kiro in this corpus, which all sat on an approval dialog reading idle.
# `permission required` is why this one did not - not anything OpenCode-specific.
#
